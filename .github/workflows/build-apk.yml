name: Build Android APK
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'lib/**'
      - 'pubspec.yaml'
      - '.github/workflows/build-apk.yml'
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Create Android project
        run: flutter create --platforms=android --project-name eye_break .
      - name: Configure Android notifications
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('android/app/build.gradle.kts')
          s=p.read_text()
          s=s.replace('compileSdk = flutter.compileSdkVersion','compileSdk = 36')
          s=s.replace('compileOptions {','compileOptions {\n        isCoreLibraryDesugaringEnabled = true')
          s += '\ndependencies {\n    coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.4")\n}\n'
          p.write_text(s)
          p=Path('android/app/src/main/AndroidManifest.xml')
          s=p.read_text().replace('<application','<uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>\n    <uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED"/>\n    <application',1)
          s=s.replace('</application>','''<receiver android:exported="false" android:name="com.dexterous.flutterlocalnotifications.ScheduledNotificationReceiver" />
              <receiver android:exported="false" android:name="com.dexterous.flutterlocalnotifications.ScheduledNotificationBootReceiver">
                <intent-filter>
                  <action android:name="android.intent.action.BOOT_COMPLETED"/>
                  <action android:name="android.intent.action.MY_PACKAGE_REPLACED"/>
                </intent-filter>
              </receiver>
            </application>''')
          p.write_text(s)
          PY
      - name: Install packages
        run: flutter pub get
      - name: Build APK
        run: |
          set -o pipefail
          flutter build apk --release 2>&1 | tee build.log
      - name: Publish build failure diagnostic
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          { echo 'Automatic build error report:'; echo '\`\`\`'; tail -n 100 build.log 2>/dev/null || echo 'No build log'; echo '\`\`\`'; } > error-report.md
          gh issue create --title "APK build failed - run ${{ github.run_id }}" --body-file error-report.md || true
      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: eye-break-apk
          path: build/app/outputs/flutter-apk/app-release.apk
